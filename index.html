<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Text Extractor</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .upload-area {
      border: 2px dashed #3498db;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 90%;
      max-width: 500px;
      transition: 0.3s;
    }

    .upload-area.dragover {
      background: #e6f7ff;
      border-color: #2980b9;
    }

    #imageUpload {
      display: none;
    }

    .custom-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .custom-btn:hover {
      background-color: #2980b9;
    }

    #output {
      margin-top: 20px;
      background: #fff;
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>📷 Image to Text Extractor</h1>

  <div class="upload-area" id="dropZone">
    <p>📤 Drag & Drop, Paste, or <label for="imageUpload" class="custom-btn">Upload Image</label></p>
    <input type="file" id="imageUpload" accept="image/*">
  </div>

  <pre id="output">Text will appear here...</pre>

  <script>
    const dropZone = document.getElementById('dropZone');
    const output = document.getElementById('output');
    const languages = 'eng+ben+ara+hin';

    // Common OCR function
    function handleImage(image) {
      output.innerText = "⏳ Processing image...";
      Tesseract.recognize(image, languages, {
        logger: m => console.log(m)
      }).then(({ data: { text } }) => {
        output.innerText = text || "❌ No text found.";
      }).catch(err => {
        output.innerText = "❌ Error: " + err.message;
      });
    }

    // File input
    document.getElementById('imageUpload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) handleImage(file);
    });

    // Drag and drop
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handleImage(file);
    });

    // Paste from clipboard
    window.addEventListener('paste', e => {
      const items = e.clipboardData.items;
      for (const item of items) {
        if (item.type.indexOf("image") !== -1) {
          const blob = item.getAsFile();
          handleImage(blob);
          break;
        }
      }
    });
  </script>
</body>
</html>
